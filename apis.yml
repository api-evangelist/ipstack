image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ipstack.png
name: IPstack
description: >-
  IPstack is an IP geolocation API from APILayer, an Idera, Inc. brand. A single GET
  request against api.ipstack.com resolves an IPv4 or IPv6 address into more than 100
  fields — country, region and city, latitude and longitude, time zone, local currency,
  ISP, ASN and connection type — plus an optional security module that flags proxies,
  VPNs, Tor exit nodes and known threat actors. Standard, bulk (up to 50 addresses) and
  requester lookups are offered in JSON, XML and JSONP. The same data is exposed to agents
  through APILayer's hosted MCP server at mcp.apilayer.com, which publishes RFC 9728
  protected-resource metadata and an OAuth authorization server at auth.apilayer.com.
