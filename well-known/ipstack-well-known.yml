method: probed
source: 'Direct anonymous HTTPS probes of /.well-known/* on every host this record knows: the registrable
  domain (ipstack.com) and www, the REST baseURL host (api.ipstack.com), the MCP baseURL host (mcp.apilayer.com),
  the parent brand host (apilayer.com), the docs host (docs.apilayer.com), and auth.apilayer.com — the
  third host named in authorization_servers[] by the MCP protected-resource document.'
name: IPstack .well-known discovery probe
description: 'Anonymous probe of the standard /.well-known/ discovery paths across every IPstack / APILayer
  host. Three real documents were served, all of them on the APILayer MCP and auth hosts rather than on
  ipstack.com itself: an RFC 9728 OAuth protected-resource document at mcp.apilayer.com that names https://auth.apilayer.com
  as its authorization server, and RFC 8414 / OpenID Connect discovery documents on that auth host. The
  ipstack.com WordPress site serves no /.well-known/ documents at all.'
notes:
- api.ipstack.com answers HTTP 200 with application/json for EVERY path, including every /.well-known/*
  path — the body is always the API's own {"success":false,"error":{"code":101,"type":"missing_access_key"}}
  envelope, not a discovery document. Every api.ipstack.com row below is therefore recorded as a MISS
  despite the 200 status code; a catch-all 200 is not a served document.
- 'The MCP endpoint''s 401 carries a conformant RFC 9728 challenge header: WWW-Authenticate: Bearer resource_metadata="https://mcp.apilayer.com/.well-known/oauth-protected-resource"'
- No security.txt is served on any IPstack or APILayer host.
