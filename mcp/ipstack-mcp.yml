name: IPstack MCP Server
description: APILayer operates one hosted MCP server for its whole API suite at https://mcp.apilayer.com/mcp;
  IPstack's geolocation lookups are exposed through it and scoped by the OAuth scope api:ipstack. The
  server is real and reachable but every method — including tools/list and initialize — is authentication-gated,
  so the live inputSchema for each tool could not be read anonymously.
