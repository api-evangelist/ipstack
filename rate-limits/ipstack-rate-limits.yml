name: IPstack rate limits and quota signaling
description: >-
  IPstack meters by MONTHLY REQUEST QUOTA, not by requests-per-second, and it publishes no
  runtime rate-limit signal at all. An agent gets no header telling it how much quota is
  left, no Retry-After when it runs out, and no distinct HTTP status — the same HTTP 200
  that carries a successful lookup carries the failure.
